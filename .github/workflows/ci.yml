# Integrazione continua di BeeWatch AI.
#
# Gira su una macchina pulita a ogni push su main e a ogni pull request: è la
# sola prova che il progetto si installa davvero da zero. Sul computer di chi
# sviluppa funziona sempre — perché lì tutto è già installato.
#
# Tre passaggi, dal più veloce al più lento, così un errore banale si scopre
# in venti secondi invece che in tre minuti:
#   1. ruff  -> stile e import
#   2. pytest -> comportamento
#   3. copertura -> quanto codice è effettivamente eseguito dai test

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Se si pusha due volte di fila sullo stesso branch, la prima esecuzione viene
# annullata: non serve aspettare il risultato di un commit già superato.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualita:
    name: Lint e test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installazione del progetto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # I test marcati `integration` richiedono MySQL o la rete: qui non ci
      # sono. Verranno abilitati in M2, con un servizio MySQL nel workflow.
      - name: Test (pytest)
        run: pytest -m "not integration" --cov=beewatch --cov-report=term-missing
